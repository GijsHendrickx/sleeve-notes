<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}sleeve-notes{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'ui-sans-serif', 'system-ui', '"Helvetica Neue"', 'Arial', 'sans-serif'],
            mono: ['"SF Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
          colors: {
            app: {
              bg:    '#0c0c0e',
              s1:    '#161618',
              s2:    '#1d1d1f',
              s3:    '#2a2a2c',
              line:  'rgba(255,255,255,0.07)',
              line2: 'rgba(255,255,255,0.12)',
              ink:   '#f5f5f7',
              dim:   '#98989d',
              mute:  '#6e6e73',
            },
          },
        },
      },
    };
  </script>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script src="/static/app.js?v=14" defer></script>
  <style>
    :root {
      --app-bg: #0c0c0e;
      --s1: #161618;
      --s2: #1d1d1f;
      --s3: #2a2a2c;
      --line: rgba(255,255,255,0.07);
      --line2: rgba(255,255,255,0.12);
      --ink: #f5f5f7;
      --dim: #98989d;
      --mute: #6e6e73;
    }
    html, body { font-feature-settings: "ss01", "cv11"; -webkit-font-smoothing: antialiased; }
    body { background: var(--app-bg); color: var(--ink); letter-spacing: -0.005em; }

    /* Hairline borders that feel like macOS separators */
    .hairline   { border-color: var(--line); }
    .hairline-2 { border-color: var(--line2); }

    /* Surfaces */
    .surface-1 { background: var(--s1); }
    .surface-2 { background: var(--s2); }
    .surface-3 { background: var(--s3); }

    /* Frosted vibrancy — Apple-style blur behind floating panels */
    .vibrancy {
      background: rgba(22,22,24,0.78);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }
    .vibrancy-strong {
      background: rgba(12,12,14,0.72);
      backdrop-filter: saturate(180%) blur(28px);
      -webkit-backdrop-filter: saturate(180%) blur(28px);
    }

    /* Density — body class toggles row padding & body type scale */
    body.density-comfortable table.dense th,
    body.density-comfortable table.dense td { padding: 0.55rem 0.85rem; }
    body.density-compact table.dense th,
    body.density-compact table.dense td { padding: 0.3rem 0.6rem; }
    body.density-comfortable { font-size: 14px; }
    body.density-compact     { font-size: 13px; }

    /* Tables get rounded outer corners cleanly */
    table.dense thead th { font-weight: 500; }
    table.dense tbody tr { transition: background-color 120ms ease; }

    /* Inputs — softer, focus ring uses Apple blue */
    .field {
      background: var(--s2);
      border: 1px solid var(--line);
      border-radius: 7px;
      transition: border-color 120ms ease, box-shadow 120ms ease, background-color 120ms ease;
    }
    .field:focus, .field:focus-visible {
      outline: none;
      border-color: rgba(10,132,255,0.6);
      box-shadow: 0 0 0 3px rgba(10,132,255,0.18);
      background: var(--s3);
    }
    .field::placeholder { color: var(--mute); }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.4rem 0.85rem; border-radius: 8px;
      font-size: 13px; font-weight: 500;
      transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
      border: 1px solid transparent;
    }
    .btn-primary { background: #0a84ff; color: #fff; }
    .btn-primary:hover { background: #2393ff; }
    .btn-success { background: #30d158; color: #042e10; }
    .btn-success:hover { background: #4be072; }
    .btn-ghost   { background: transparent; color: var(--ink); border-color: var(--line2); }
    .btn-ghost:hover { background: var(--s2); }
    .btn-quiet   { background: transparent; color: var(--ink); border-color: var(--line); }
    .btn-quiet:hover { background: var(--s2); color: var(--ink); }

    /* Cards */
    .card {
      background: var(--s1);
      border: 1px solid var(--line);
      border-radius: 14px;
      transition: border-color 160ms ease, transform 160ms ease;
    }
    .card-hover:hover { border-color: var(--line2); }

    /* Sidebar nav active indicator — soft pill */
    .nav-item {
      display: block;
      margin: 1px 8px;
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 13px;
      color: var(--ink);
      transition: background-color 120ms ease, color 120ms ease;
    }
    .nav-item:hover { background: var(--s2); color: var(--ink); }
    .nav-item.active { background: var(--s3); color: var(--ink); }
    .nav-section {
      margin: 0 16px;
      padding: 6px 0 4px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--mute);
    }
    .nav-action { display: flex; align-items: center; gap: 8px; }
    .nav-glyph {
      display: inline-flex; align-items: center; justify-content: center;
      width: 14px; color: var(--dim); font-size: 13px;
    }
    .nav-action:hover .nav-glyph { color: var(--ink); }

    /* Modal — centered dialog with frosted backdrop. Used by sidebar actions. */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 40;
      background: rgba(0,0,0,0.55);
      backdrop-filter: saturate(140%) blur(4px);
      -webkit-backdrop-filter: saturate(140%) blur(4px);
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
    }
    .modal-card {
      width: 100%; max-width: 28rem;
      background: var(--s1); border: 1px solid var(--line2); border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    /* Run toast — fixed bottom-right notification with indeterminate progress */
    .run-toast {
      position: fixed; right: 20px; bottom: 20px; z-index: 50;
      width: 360px; max-width: calc(100vw - 40px);
      background: rgba(22,22,24,0.92);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border: 1px solid var(--line2);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.45);
      overflow: hidden;
      animation: toast-in 200ms ease-out;
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .progress-track {
      position: relative; height: 3px; background: var(--s3); overflow: hidden;
    }
    .progress-bar {
      position: absolute; top: 0; bottom: 0; width: 40%;
      background: linear-gradient(90deg, transparent, #0a84ff 50%, transparent);
      animation: progress-slide 1.4s ease-in-out infinite;
    }
    /* Determinate mode — bar fills left to right based on --progress (0-100%). */
    .progress-track.determinate .progress-bar {
      left: 0; width: var(--progress, 0%);
      background: #0a84ff;
      animation: none;
      transition: width 300ms ease-out;
    }
    .progress-track.done .progress-bar {
      width: 100%; left: 0; background: #30d158; animation: none;
    }
    .progress-track.failed .progress-bar {
      width: 100%; left: 0; background: #ff453a; animation: none;
    }
    .progress-track.cancelled .progress-bar {
      width: 100%; left: 0; background: #ff9f0a; animation: none;
    }
    @keyframes progress-slide {
      0%   { left: -45%; }
      100% { left: 100%; }
    }

    /* Sticker preview canvas — borrow paper colour */
    .sticker-preview { background: #fafaf7; box-shadow: 0 4px 24px rgba(0,0,0,.35); border-radius: 6px; }

    /* Per-row sync button on /tracks — spins while htmx request is in flight. */
    .sync-btn.htmx-request {
      color: #0a84ff;
      pointer-events: none;
      animation: sync-spin 0.9s linear infinite;
      transform-origin: 50% 50%;
      display: inline-block;
    }
    @keyframes sync-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Flash applied to BPM/Key cells after a successful per-row sync, so the
       user gets visual confirmation that those values were refreshed (even
       when the numeric value didn't change). */
    .flash-sync { animation: cell-flash 1.6s ease-out; }
    @keyframes cell-flash {
      0%   { background-color: rgba(10,132,255,0.45); }
      30%  { background-color: rgba(10,132,255,0.30); }
      100% { background-color: transparent; }
    }

    /* Scrollbar — slim, themed */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.16); background-clip: padding-box; border: 2px solid transparent; }
  </style>
</head>
<body class="density-comfortable min-h-screen font-sans antialiased">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <nav class="w-60 border-r hairline flex flex-col shrink-0 surface-1">
      <div class="px-4 pt-5 pb-4">
        <a href="/" class="flex items-baseline gap-1.5">
          <span class="text-[20px] font-semibold tracking-tight text-app-ink">Sleeve Notes</span>
        </a>
        <div class="text-[11px] text-app-mute mt-0.5 tracking-wide">v0.3</div>
      </div>
      <div class="flex-1 py-1 overflow-y-auto">
        <div class="nav-section">Collection</div>
        <a href="/collection" class="nav-item{% if active == 'collection' %} active{% endif %}">Records</a>
        <a href="/tracks" class="nav-item{% if active == 'tracks' %} active{% endif %}">Tracks</a>

        <div class="nav-section mt-4">Actions</div>
        <button type="button" class="nav-item nav-action w-full text-left"
                hx-get="/actions/discogs-sync" hx-target="#modal-root" hx-swap="innerHTML">
          <span class="nav-glyph">⟳</span> Discogs sync
        </button>
        <button type="button" class="nav-item nav-action w-full text-left"
                hx-get="/actions/discogs-import" hx-target="#modal-root" hx-swap="innerHTML">
          <span class="nav-glyph">⬇</span> Import Discogs csv
        </button>
        <button type="button" class="nav-item nav-action w-full text-left"
                hx-get="/actions/bpm" hx-target="#modal-root" hx-swap="innerHTML">
          <span class="nav-glyph">♪</span> BPM lookup
        </button>
        <a href="/preview" class="nav-item nav-action{% if active == 'preview' %} active{% endif %}">
          <span class="nav-glyph">▦</span> Generate stickers
        </a>

      </div>
      <div class="px-4 py-3 border-t hairline text-[11px] text-app-mute flex items-center justify-between">
        <span>engine · <span class="text-app-dim">sleeve_notes</span></span>
        <button type="button" id="density-toggle" title="Toggle density"
                class="text-app-mute hover:text-app-ink transition-colors"
                onclick="window.__sleeveToggleDensity && window.__sleeveToggleDensity()">
          <span id="density-label">comfy</span>
        </button>
      </div>
    </nav>

    <!-- Main -->
    <div class="flex-1 flex flex-col min-w-0">
      <header class="h-14 shrink-0 flex items-center justify-between px-7 border-b hairline vibrancy-strong sticky top-0 z-20">
        <div class="text-[19px] text-app-ink font-semibold tracking-tight">{% block breadcrumb %}{% endblock %}</div>
      </header>
      <main class="flex-1 px-7 py-6 overflow-x-hidden">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <!-- Modal mount: sidebar action buttons htmx-load into this slot. -->
  <div id="modal-root"></div>

  <!-- Run-status toast: fixed bottom-right; htmx-fills on job start/transition. -->
  <div id="run-banner" hx-get="/run/banner" hx-trigger="load, runStatus from:body" hx-swap="innerHTML"></div>

</body>
</html>
