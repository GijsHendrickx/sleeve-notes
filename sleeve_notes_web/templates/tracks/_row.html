<tr class="border-t hairline align-middle hover:bg-app-s2/40">
  <td class="text-app-dim">
    <a class="hover:text-app-ink" href="/collection/{{ r.release_id }}"
       title="{{ r.release_artist }} – {{ r.release_title }}">
      <div class="truncate max-w-[12rem] text-app-ink">{{ r.release_artist or 'V/A' }}</div>
      <div class="truncate max-w-[12rem] text-[11px] text-app-mute">{{ r.release_title }}</div>
    </a>
  </td>
  <td class="font-mono text-app-mute">{{ r.position }}</td>
  <td>
    <div class="text-app-ink">{{ r.title }}</div>
    <div class="text-[11px] text-app-mute">{{ r.artist }}</div>
  </td>
  <td class="text-right font-mono {% if just_synced %}flash-sync{% endif %}
    {% if r.bpm_confidence in ('high','manual') %}text-emerald-400
    {% elif r.bpm_confidence == 'octave' %}text-cyan-400
    {% elif r.bpm_confidence == 'shared' %}text-yellow-400
    {% elif r.bpm_confidence == 'disputed' %}text-amber-400
    {% elif r.bpm %}text-app-ink
    {% else %}text-app-mute{% endif %}"
    {% if r.bpm_sources %}title="sources: {{ r.bpm_sources|join(', ') }}{% if r.shared_siblings %} (URL shared across {{ r.shared_siblings }} sibling tracks — likely matched to base, not this specific remix){% endif %}"{% endif %}>
    {{ r.bpm or '·' }}
  </td>
  <td class="font-mono {% if just_synced %}flash-sync{% endif %} {% if r.key_camelot %}text-app-ink{% else %}text-app-mute{% endif %}">{{ r.key_camelot or '·' }}</td>
  <td class="text-center w-8">
    <button type="button"
            class="sync-btn text-app-mute hover:text-app-ink text-[14px] leading-none transition-colors"
            hx-post="/tracks/sync"
            hx-vals='{"release_id": {{ r.release_id }}, "position": {{ r.position|tojson }}}'
            hx-include="closest tr"
            hx-target="closest tr"
            hx-swap="outerHTML"
            title="Re-fetch BPM and key for this track">↻</button>
  </td>
  <td class="text-right border-l hairline-2 pl-3">
    <input name="bpm_{{ r.release_id }}_{{ r.position }}" value="{{ r.override.bpm or '' }}"
           inputmode="numeric" maxlength="3"
           class="field w-16 px-2 py-1 font-mono text-right text-app-ink text-[13px]" />
  </td>
  <td>
    <input name="key_{{ r.release_id }}_{{ r.position }}" value="{{ r.override.key_camelot or '' }}"
           maxlength="4"
           class="field w-16 px-2 py-1 font-mono text-app-ink text-[13px]" />
  </td>
  <td>
    <input name="note_{{ r.release_id }}_{{ r.position }}" value="{{ r.override.note or '' }}"
           class="field w-full px-2 py-1 text-[12px] text-app-dim" />
  </td>
  <td class="text-center w-10 border-l hairline-2 pl-3">
    {% with release_id=r.release_id, position=r.position, spotify_track_id=r.spotify_track_id %}
      {% include "_listen_glyph.html" %}
    {% endwith %}
  </td>
</tr>
