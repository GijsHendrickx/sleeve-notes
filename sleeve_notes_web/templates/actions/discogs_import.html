{% extends "actions/_modal.html" %}
{% block heading %}Import Discogs csv{% endblock %}
{% block subhead %}
<div class="text-[12px] text-app-mute mt-1">Use a Discogs collection export instead of the API. Per-release tracklists are still pulled from the API as needed.</div>
{% endblock %}
{% block body %}
<form hx-post="/actions/discogs-import/start"
      hx-target="#modal-root" hx-swap="innerHTML"
      hx-encoding="multipart/form-data"
      class="space-y-4">
  <label class="block">
    <div class="text-[11px] uppercase tracking-[0.08em] text-app-mute font-medium mb-1.5">CSV file</div>
    <input name="csv" type="file" accept=".csv,text/csv" required
           class="field block w-full px-2.5 py-1.5 text-[12.5px] file:mr-3 file:rounded-md file:border-0 file:bg-app-s3 file:text-app-ink file:px-3 file:py-1 file:text-[12px] file:hover:bg-app-line2" />
    <div class="text-[11px] text-app-mute mt-1">Collection → Export → "CSV (without recommendations)".</div>
  </label>
  <label class="block">
    <div class="text-[11px] uppercase tracking-[0.08em] text-app-mute font-medium mb-1.5">Folder (optional)</div>
    <input name="folder" type="text" placeholder="e.g. DJ"
           class="field h-8 w-full px-2.5 text-[13px]" autocomplete="off" />
    <div class="text-[11px] text-app-mute mt-1">Matches against the CSV's <code class="text-app-dim">CollectionFolder</code> column.</div>
  </label>
  <div class="flex gap-2 justify-end pt-1">
    <button type="button" class="btn btn-ghost"
            hx-get="/actions/close" hx-target="#modal-root" hx-swap="innerHTML">Cancel</button>
    <button type="submit" class="btn btn-primary">Import</button>
  </div>
</form>
{% endblock %}
