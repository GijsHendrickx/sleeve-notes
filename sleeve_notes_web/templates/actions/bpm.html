{% extends "actions/_modal.html" %}
{% block heading %}BPM lookup{% endblock %}
{% block subhead %}
<div class="text-[12px] text-app-mute mt-1">5-source cascade: songbpm + Deezer + ReccoBeats + Beatport + AcousticBrainz. Already-queried tracks are skipped by default.</div>
{% endblock %}
{% block body %}
<form hx-post="/actions/bpm/start"
      hx-target="#modal-root" hx-swap="innerHTML"
      class="space-y-4">
  <label class="flex items-start gap-2.5">
    <input type="checkbox" name="force" value="1"
           class="accent-emerald-500 w-4 h-4 mt-0.5" />
    <span class="text-[13px]">
      <div class="text-app-ink">Force re-fetch all</div>
      <div class="text-[11px] text-app-mute mt-0.5">Wipes the BPM cache before running, so every track is re-queried from every source. Otherwise only tracks missing a source are looked up.</div>
    </span>
  </label>
  <div class="flex gap-2 justify-end pt-1">
    <button type="button" class="btn btn-ghost"
            hx-get="/actions/close" hx-target="#modal-root" hx-swap="innerHTML">Cancel</button>
    <button type="submit" class="btn btn-primary">Start BPM lookup</button>
  </div>
</form>
{% endblock %}
