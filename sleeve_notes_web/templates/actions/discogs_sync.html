{% extends "actions/_modal.html" %}
{% block heading %}Discogs sync{% endblock %}
{% block subhead %}
<div class="text-[12px] text-app-mute mt-1">Fetch your collection via the Discogs API. Existing rows are kept; only new releases are pulled.</div>
{% endblock %}
{% block body %}
<form hx-post="/actions/discogs-sync/start"
      hx-target="#modal-root" hx-swap="innerHTML"
      class="space-y-4">
  <label class="block">
    <div class="text-[11px] uppercase tracking-[0.08em] text-app-mute font-medium mb-1.5">Folder (optional)</div>
    <input name="folder" type="text" placeholder="e.g. DJ"
           class="field h-8 w-full px-2.5 text-[13px]" autocomplete="off" autofocus />
    <div class="text-[11px] text-app-mute mt-1">Case-insensitive folder name. Leave blank for the whole collection.</div>
  </label>
  <label class="block">
    <div class="text-[11px] uppercase tracking-[0.08em] text-app-mute font-medium mb-1.5">Limit (optional)</div>
    <input name="limit" type="number" min="1" placeholder="all"
           class="field h-8 w-32 px-2.5 font-mono text-[13px]" />
    <div class="text-[11px] text-app-mute mt-1">Stop after N releases — useful for debug runs.</div>
  </label>
  <div class="flex gap-2 justify-end pt-1">
    <button type="button" class="btn btn-ghost"
            hx-get="/actions/close" hx-target="#modal-root" hx-swap="innerHTML">Cancel</button>
    <button type="submit" class="btn btn-primary">Start sync</button>
  </div>
</form>
{% endblock %}
