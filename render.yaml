databases:
  - name: sleeve-notes-db-staging
    plan: basic-256mb
    postgresMajorVersion: 16
    region: frankfurt

services:
  - type: web
    name: sleeve-notes-web-staging
    runtime: docker
    plan: starter
    branch: django-port
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: APP_NAME
        value: Sleeve Notes
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DEFAULT_FROM_EMAIL
        value: noreply@example.com
      - key: DATABASE_URL
        fromDatabase:
          name: sleeve-notes-db-staging
          property: connectionString
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: DISCOGS_CONSUMER_KEY
        sync: false
      - key: DISCOGS_CONSUMER_SECRET
        sync: false
