databases:
  - name: sleeve-notes-db-staging
    plan: basic-256mb
    postgresMajorVersion: "16"
    region: frankfurt

services:
  - type: web
    name: sleeve-notes-web-staging
    runtime: docker
    plan: starter
    branch: django-port
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: APP_NAME
        value: Sleeve Notes
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://sleeve-notes-web-staging.onrender.com
      - key: DEFAULT_FROM_EMAIL
        value: noreply@example.com
      - key: DATABASE_URL
        fromDatabase:
          name: sleeve-notes-db-staging
          property: connectionString
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: DISCOGS_CONSUMER_KEY
        sync: false
      - key: DISCOGS_CONSUMER_SECRET
        sync: false
      - key: STAGING_BASIC_AUTH_USER
        sync: false
      - key: STAGING_BASIC_AUTH_PASSWORD
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: worker
    name: sleeve-notes-worker-staging
    runtime: docker
    plan: starter
    branch: django-port
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    # Same image as the web service, different entrypoint: run the Q2 cluster
    # instead of gunicorn. Migrations are owned by the web service, so the
    # worker just starts qcluster — exiting on SIGTERM, which Q2 handles cleanly.
    dockerCommand: python manage.py qcluster
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: APP_NAME
        value: Sleeve Notes
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DEFAULT_FROM_EMAIL
        value: noreply@example.com
      - key: DATABASE_URL
        fromDatabase:
          name: sleeve-notes-db-staging
          property: connectionString
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: DISCOGS_CONSUMER_KEY
        sync: false
      - key: DISCOGS_CONSUMER_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
