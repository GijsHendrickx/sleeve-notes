<div class="run-toast"
     hx-get="{% url 'run_banner' %}"
     hx-trigger="every 2s"
     hx-swap="outerHTML">
  <div class="progress-track"><div class="progress-bar"></div></div>
  <div class="p-3">
    <div class="text-app-ink text-[13px] font-medium">{{ title }}</div>
    <div class="text-app-mute text-[11px] mt-0.5">Running for {{ elapsed_s }}s…</div>
  </div>
</div>
