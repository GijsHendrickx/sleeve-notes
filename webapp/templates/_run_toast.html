<div class="run-toast"
     hx-get="{% url 'run_banner' %}"
     hx-trigger="every 2s"
     hx-swap="outerHTML">
  <div class="progress-track"><div class="progress-bar"></div></div>
  <div class="p-3">
    <div class="text-app-ink text-[13px] font-medium">{{ title }}</div>
    {% if progress_text %}
      <div class="text-app-dim text-[12px] mt-1">{{ progress_text }}</div>
    {% endif %}
    <div class="text-app-mute text-[11px] mt-1">Running for {{ elapsed_s }}s…</div>
  </div>
</div>
