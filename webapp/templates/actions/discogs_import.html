{% extends "actions/_modal.html" %}

{% block body %}
<form hx-post="{% url 'records:action_discogs_import' %}"
      hx-target="this" hx-swap="none"
      hx-encoding="multipart/form-data"
      class="space-y-3">
  {% csrf_token %}
  <label class="block">
    <span class="text-app-dim text-[12px] mb-1 block">CSV file</span>
    <input name="csv" type="file" accept=".csv,text/csv" required
           class="field block w-full px-2.5 py-1.5 text-[12.5px]
                  file:mr-3 file:rounded-md file:border-0
                  file:bg-app-s3 file:text-app-ink
                  file:px-3 file:py-1 file:text-[12px]" />
    <span class="block text-app-mute text-[11px] mt-1">
      Discogs → Collection → Export → "CSV (without recommendations)".
    </span>
  </label>
  <label class="block">
    <span class="text-app-dim text-[12px] mb-1 block">Folder (optional)</span>
    <input name="folder" placeholder="e.g. DJ"
           class="field h-8 px-3 w-full text-[13px]" autocomplete="off" />
    <span class="block text-app-mute text-[11px] mt-1">
      Matches the CSV's <code class="text-app-dim">CollectionFolder</code> column.
    </span>
  </label>
  <div class="flex gap-2 justify-end pt-2">
    <button type="button" class="btn btn-quiet"
            hx-on:click="document.getElementById('modal-root').innerHTML='';">
      Cancel
    </button>
    <button type="submit" class="btn btn-primary">Import</button>
  </div>
</form>
{% endblock %}
