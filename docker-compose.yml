services:
  db:
    image: postgres:16
    container_name: sleevenotes-db
    environment:
      POSTGRES_DB: sleevenotes
      POSTGRES_USER: sleevenotes
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - ./.tmp/pgdata:/var/lib/postgresql/data
    restart: unless-stopped
