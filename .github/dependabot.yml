version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR per week for patch/minor bumps; majors stay separate so they
      # get looked at one by one.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Stay on the LTS track: 5.2 until 6.2 LTS (April 2027). That upgrade is
      # a planned project (roadmap.md → Jobs-backend), not a weekly bump.
      - dependency-name: django
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
