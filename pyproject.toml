[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeve-notes"
version = "0.3.0"
description = "Generate printable A4 BPM/key/QR stickers for your Discogs vinyl collection."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Gijs Hendrickx" }]
dependencies = [
    # Engine (pure / shared)
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
    "tenacity>=8.2,<10",
    "beautifulsoup4>=4.12,<5",
    "rapidfuzz>=3.6,<4",
    "reportlab>=4.1,<6",
    "qrcode>=7.4,<9",
    "requests-oauthlib>=1.3,<3",
    "yt-dlp>=2026.8,<2027",
    # Django web app (webapp/)
    "django>=5.2,<5.3",
    "django-environ>=0.11,<1",
    "psycopg[binary]>=3.1,<4",
    "gunicorn>=22,<27",
    "sentry-sdk[django]>=2,<3",
    "django-allauth[socialaccount]>=65,<66",
    "django-q2>=1.7,<2",
    "cryptography>=42",
    "blessed>=1.20,<2",
]

[project.optional-dependencies]
# Opt-in audio BPM measurement (AUDIO_ANALYSIS_ENABLED). An extra, not a hard
# dependency: Essentia only has wheels for Python 3.14 on Linux x86_64 and
# macOS 15+, and without it the rest of the app installs anywhere. Without the
# extra, the audio source reports itself unavailable and the cascade skips it.
audio = [
    # Exact pin: every build is 2.1b6.devNNNN, so a range can't hold, and
    # MIN_ESSENTIA_CONFIDENCE is tuned to this build's confidence scale. The
    # click/noise tests in records/tests.py fail if a bump shifts it.
    "essentia==2.1b6.dev1438",
]

[project.scripts]
sleeve-notes = "sleeve_notes.cli:main"

[tool.setuptools]
packages = ["sleeve_notes"]

[tool.ruff]
line-length = 100

[tool.flake8]
max-line-length = 100
