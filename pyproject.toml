[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeve-notes"
version = "0.3.0"
description = "Generate printable A4 BPM/key/QR stickers for your Discogs vinyl collection."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Gijs Hendrickx" }]
dependencies = [
    # Engine + legacy FastAPI web UI
    "requests>=2.31,<3",
    "urllib3<2",
    "python-dotenv>=1.0,<2",
    "tenacity>=8.2,<9",
    "beautifulsoup4>=4.12,<5",
    "rapidfuzz>=3.6,<4",
    "reportlab>=4.1,<5",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "jinja2>=3.1,<4",
    "qrcode>=7.4,<9",
    "python-multipart>=0.0.9,<1",
    "requests-oauthlib>=1.3,<3",
    "itsdangerous>=2,<3",
    # Django port (webapp/)
    "django>=5.2,<5.3",
    "django-environ>=0.11,<1",
    "psycopg[binary]>=3.1,<4",
    "gunicorn>=22,<23",
    "sentry-sdk[django]>=2,<3",
    "django-allauth[socialaccount]>=65,<66",
]

[project.scripts]
sleeve-notes = "sleeve_notes.cli:main"

[tool.setuptools]
packages = ["sleeve_notes", "sleeve_notes_web"]

[tool.ruff]
line-length = 100

[tool.flake8]
max-line-length = 100
