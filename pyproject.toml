[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeve-notes"
version = "0.3.0"
description = "Generate printable A4 BPM/key/QR stickers for your Discogs vinyl collection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gijs Hendrickx" }]
dependencies = [
    "requests>=2.31,<3",
    "urllib3<2",
    "python-dotenv>=1.0,<2",
    "tenacity>=8.2,<9",
    "beautifulsoup4>=4.12,<5",
    "rapidfuzz>=3.6,<4",
    "reportlab>=4.1,<5",
]

[project.scripts]
sleeve-notes = "sleeve_notes.cli:main"

[tool.setuptools]
packages = ["sleeve_notes"]
